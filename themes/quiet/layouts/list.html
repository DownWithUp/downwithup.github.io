{{ define "main" }}
<p class="eyebrow">THE NOTEBOOK</p>
<h1>{{ .Title }}</h1>
<div class="prose">{{ .Content }}</div>
<div class="post-list">
{{ range .Pages.ByDate.Reverse }}
  <article><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description }}</p><a class="read-link" href="{{ .RelPermalink }}">Read entry <span aria-hidden="true">↗</span></a></article>
{{ end }}
</div>
{{ end }}
